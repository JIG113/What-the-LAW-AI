name: Backend CI & Release Artifacts

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: bash build_tools/build_linux_binary.sh

      - name: Archive Linux artifact
        run: |
          mkdir -p dist_release/linux
          cp -r dist/* dist_release/linux/
          cp build_tools/app_config.example.json dist_release/linux/
          cp build_tools/start_backend_linux.sh dist_release/linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-binary
          path: backend/dist_release/linux

  build-windows:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows exe
        shell: pwsh
        run: ./build_tools/build_windows_exe.ps1

      - name: Archive Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_release/windows | Out-Null
          Copy-Item -Path dist/* -Destination dist_release/windows -Recurse -Force
          Copy-Item -Path build_tools/app_config.example.json -Destination dist_release/windows -Force
          Copy-Item -Path build_tools/start_backend_windows.bat -Destination dist_release/windows -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows-exe
          path: backend/dist_release/windows

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-binary
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-windows-exe
          path: release/windows

      - name: Zip artifacts
        run: |
          cd release
          zip -r backend-linux-binary.zip linux
          zip -r backend-windows-exe.zip windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/backend-linux-binary.zip
            release/backend-windows-exe.zip
          generate_release_notes: true
